<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RTT Veldplanner</title>
<meta name="description" content="Het speelveld van Running the Target (Smeetsweg 8, Zoeterwoude) tekenen, tellen en delen met de bouwers.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCFCFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Veldplanner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: tekentafel. Een licht tekenvel (canvas) ligt op een koel-grijze ondergrond,
   met de gereedschapsrail links en de stuklijst rechts. Alles is gericht op lezen op de bouwvloer. */
:root{
  --desk:#E6E9E4; --sheet:#FCFCFA; --surface:#F5F6F3; --surface-2:#ECEFEA;
  --ink:#1E2124; --ink-2:#4F565C; --ink-3:#7F878D;
  --line:#D2D7D0; --line-2:#BCC3BA;
  --accent:#E30613; --accent-ink:#B4040F; --accent-soft:#FBE4E5;
  --glass:#3B7BB0; --green:#2F7D4A; --green-soft:#E1F0E5; --warn:#A8620A; --warn-soft:#F8ECD9;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(30,33,36,.06),0 8px 24px -12px rgba(30,33,36,.22);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* bovenbalk */
.top{display:flex;align-items:center;gap:10px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--sheet);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{height:22px;width:auto;display:block}
.brand b{font-weight:700;font-stretch:80%;font-size:15px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);padding-left:10px;border-left:1px solid var(--line)}
.fieldbtn{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:none;border:0;padding:2px 8px;border-radius:8px;min-width:0;text-align:left}
.fieldbtn:hover{background:var(--surface)}
.eyebrow{font:600 10px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.fieldname{font-weight:750;font-stretch:85%;font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font:600 11px/1 var(--f-mono);letter-spacing:.04em;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.bad{background:var(--accent-soft);color:var(--accent-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--sheet);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--surface)}
a.btn{text-decoration:none;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.red{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px;flex:none}
.btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grp{display:flex;gap:4px}

/* hoofdgrid */
.main{display:grid;grid-template-columns:auto minmax(0,1fr) 340px;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:0}
.rail{display:flex;flex-direction:column;gap:3px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:6px;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.tool{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:8px;border:0;background:none;color:var(--ink-2);flex:none}
.tool svg{width:24px;height:24px}
.tool:hover{background:var(--surface);color:var(--ink)}
.tool.on{background:var(--ink);color:#fff}
.tool kbd{position:absolute;right:3px;bottom:2px;font:600 8.5px/1 var(--f-mono);opacity:.55}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:5px 8px;border-radius:6px;white-space:nowrap}

.stage{position:relative;min-width:0;min-height:0;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:absolute;display:flex;align-items:center;gap:8px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-tl{left:40px;top:30px;right:12px;flex-wrap:wrap}
.hint{background:rgba(252,252,250,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink-2);max-width:100%}
.hint b{color:var(--ink)}
.presets{display:flex;gap:4px;flex-wrap:wrap}
.preset{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--sheet);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.preset.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.preset i{width:10px;height:10px;border-radius:3px;display:block}
.hud-bl{left:40px;bottom:10px;right:10px;justify-content:space-between;flex-wrap:wrap}
.readout{font:500 12px/1 var(--f-mono);color:var(--ink-2);background:rgba(252,252,250,.9);border:1px solid var(--line);border-radius:7px;padding:6px 9px;display:flex;gap:12px;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink);font-weight:600}
.zoom{display:flex;align-items:center;gap:2px;background:rgba(252,252,250,.92);border:1px solid var(--line);border-radius:8px;padding:2px}
.zoom button{height:28px;min-width:28px;border:0;background:none;border-radius:6px;font-weight:700}
.zoom button:hover{background:var(--surface)}
.zoom span{font:500 11.5px/1 var(--f-mono);min-width:44px;text-align:center;color:var(--ink-2)}
.diffbar{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font-size:12.5px;box-shadow:var(--shadow);max-width:calc(100% - 24px);flex-wrap:wrap}
.diffbar .k{display:inline-flex;align-items:center;gap:5px;font-weight:650}
.diffbar .k i{width:12px;height:4px;border-radius:2px;display:block}
.diffbar button{height:26px;border-radius:999px;border:0;padding:0 10px;background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.selbar{position:absolute;right:12px;top:30px;display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:12px;padding:5px;box-shadow:var(--shadow);max-width:calc(100% - 24px);flex-wrap:wrap}
.selbar span{font:600 11px/1 var(--f-mono);letter-spacing:.04em;padding:0 8px 0 6px;opacity:.75;white-space:nowrap}
.selbar button{display:inline-flex;align-items:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border:0;border-radius:8px;background:rgba(255,255,255,.1);color:#fff;font-weight:650;font-size:13px;white-space:nowrap}
.selbar button:hover{background:rgba(255,255,255,.2)}
.selbar button svg{width:18px;height:18px}
.selbar .del{background:rgba(227,6,19,.85)}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.empty .card{pointer-events:auto;background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 24px;max-width:380px;display:grid;gap:12px}
.empty h3{margin:0;font-stretch:85%;font-size:20px;text-wrap:balance}
.empty p{margin:0;color:var(--ink-2)}
.infocard{position:absolute;right:12px;top:30px;width:min(280px,calc(100% - 24px));background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;display:grid;gap:6px}
.infocard h4{margin:0;font-size:16px;font-stretch:85%}
.infocard .rowkv{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.infocard .rowkv span:first-child{color:var(--ink-3)}
.textinput{position:absolute;z-index:5;height:30px;border:2px solid var(--accent);border-radius:6px;padding:0 8px;font-weight:600;background:#fff;min-width:160px}

/* paneel */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;height:32px;border:0;border-radius:7px;background:none;font-weight:650;font-size:12.5px;color:var(--ink-3);white-space:nowrap;padding:0 8px}
.tabs button.on{background:var(--surface-2);color:var(--ink)}
.tabbody{overflow-y:auto;padding:14px 14px 22px;display:grid;gap:16px;align-content:start}
.sec{display:grid;gap:8px}
.sec>h5{margin:0;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--surface);border-radius:9px;padding:9px 10px;display:grid;gap:2px}
.stat b{font-size:22px;font-weight:750;font-stretch:80%;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-3)}
.rows{display:grid;gap:1px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--surface-2);font-size:13px}
.row.sub{padding-left:14px;color:var(--ink-2)}
.row .n{font:500 12.5px/1 var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .n small{color:var(--ink-3);font-size:11px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink-2);border-radius:3px}
.row.over .bar i{background:var(--accent)}
.row.over .n{color:var(--accent-ink);font-weight:600}
.row .flag{grid-column:1/-1;font-size:11.5px;color:var(--accent-ink);margin-top:-2px}
.muted{color:var(--ink-3);font-size:12.5px}
.advies{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:10px 12px;font-size:12.5px;font-weight:600}
.advies b{font:700 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.input{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;min-width:0;width:100%;box-sizing:border-box}
.input:focus{border-color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;height:30px;border:0;border-radius:7px;background:none;font-weight:600;font-size:12.5px;color:var(--ink-2);white-space:nowrap;padding:0 8px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0}
.toggle input{width:36px;height:20px;appearance:none;-webkit-appearance:none;background:var(--line-2);border-radius:999px;position:relative;cursor:pointer;flex:none;margin:0}
.toggle input::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.toggle input:checked{background:var(--ink)}
.toggle input:checked::after{left:18px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.list{display:grid;gap:6px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:grid;gap:6px;background:#fff}
.item.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.item .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .t b{font-size:14px;font-stretch:90%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font:500 11.5px/1.3 var(--f-mono);color:var(--ink-3)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.inv{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:6px 10px;align-items:center;font-size:13px}
.inv .input{height:30px;text-align:right;font-family:var(--f-mono)}
.kbdlist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px;color:var(--ink-2)}
.kbdlist kbd{font:600 11px/1 var(--f-mono);background:var(--surface-2);border-radius:5px;padding:4px 6px;color:var(--ink);text-align:center}

/* modals */
.modal{position:fixed;inset:0;z-index:40;background:rgba(30,33,36,.38);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.dialog{background:var(--sheet);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);width:min(520px,100%);max-height:100%;overflow:auto;padding:22px;display:grid;gap:16px;box-sizing:border-box}
.dialog h3{margin:0;font-size:22px;font-stretch:82%;text-wrap:balance}
.dialog p{margin:0;color:var(--ink-2)}
.bed{background:var(--surface);border-radius:12px;padding:12px;display:grid;gap:8px;justify-items:center}
.bed svg{width:100%;max-width:300px;height:auto}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

.only-narrow{display:none}
.mode-bouwer .edit-only{display:none!important}
.viewer #diffBtn,.viewer #pdfBtn,.viewer #printBtn,.viewer #saveChip{display:none!important}
.mode-bouwer .main{grid-template-columns:minmax(0,1fr) 340px}

@media (max-width:1080px){
  .main{grid-template-columns:auto minmax(0,1fr)}
  .mode-bouwer .main{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;z-index:30;top:0;bottom:0;right:0;width:min(380px,100%);border-radius:0;transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-20px 0 60px -20px rgba(0,0,0,.35)}
  .panel.open{transform:none}
  .only-narrow{display:inline-flex}
  .hide-mid{display:none!important}
}
@media (max-width:680px){
  .selbar{top:26px;right:8px}
  .selbar .lbl{display:none}
  .top{gap:6px;flex-wrap:wrap}
  .brand b{display:none}
  .fieldname{max-width:52vw;font-size:15px}
  .hide-narrow{display:none!important}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:8px;padding-block:8px}
  .rail{flex-direction:row;overflow-x:auto;order:2;padding:4px}
  .rail hr{border-top:0;border-left:1px solid var(--line);margin:2px 4px}
  .tool{width:42px;height:42px}
  .hud-tl{left:10px;top:26px}
  .hud-bl{left:10px}
  .readout .hide-narrow{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* losse webapp: inloggen, QR voor bouwers, veilige randen op iPhone/iPad */
#app{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer #authBtn{display:none!important}
.authbtn .lbl{max-width:140px;overflow:hidden;text-overflow:ellipsis}
.qrbox{display:grid;justify-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.qrbox svg{width:min(240px,70vw);height:auto;display:block}
.input.code{font:600 22px/1 var(--f-mono);letter-spacing:.25em;height:46px;text-align:center}
details.more summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
details.more[open] summary{margin-bottom:6px}
.dialog form{display:grid;gap:12px;margin:0}
@media (max-width:680px){.authbtn .lbl{display:none}}
</style>
</head>
<body>

<div id="app" class="mode-bouwer">
  <header class="top">
    <div class="brand" id="brand"></div>
    <button class="fieldbtn" id="fieldBtn" title="Velden openen">
      <span class="eyebrow" id="fieldMeta">Veld</span>
      <span class="fieldname" id="fieldName">Laden…</span>
    </button>
    <span class="chip hide-narrow" id="saveChip"><i></i><span>Laden</span></span>
    <div class="spacer"></div>
    <div class="grp edit-only hide-narrow">
      <button class="btn icon ghost" id="undoBtn" title="Ongedaan maken (⌘Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5 2.5 6.5l3 3"/><path d="M2.8 6.5H10a3.5 3.5 0 0 1 0 7H7"/></svg></button>
      <button class="btn icon ghost" id="redoBtn" title="Opnieuw (⇧⌘Z)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 3.5 3 3-3 3"/><path d="M13.2 6.5H6a3.5 3.5 0 0 0 0 7h3"/></svg></button>
    </div>
    <button class="btn ghost authbtn" id="authBtn" title="Inloggen om te tekenen en op te slaan"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="5.4" r="2.7"/><path d="M2.8 14c.6-2.7 2.7-4.2 5.2-4.2s4.6 1.5 5.2 4.2"/></svg><span class="lbl">Inloggen</span></button>
    <button class="btn" id="diffBtn" title="Vergelijk met een ander veld"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 2v12M11 2v12M2 5h6M8 11h6"/></svg><span class="hide-mid">Vergelijk</span></button>
    <button class="btn" id="pdfBtn" title="A3-bouwtekening als PDF"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 1.5h6l3 3v10h-9z"/><path d="M9.5 1.5v3h3M5.5 8.5h5M5.5 11h5"/></svg><span class="hide-mid">Bouwtekening</span></button>
    <button class="btn edit-only" id="printBtn" title="Maquette voor de Bambu H2D"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 1.8 14 5v6l-6 3.2L2 11V5z"/><path d="M2 5l6 3.2L14 5M8 8.2v6"/></svg><span class="hide-mid">3D-print</span></button>
    <button class="btn primary edit-only" id="saveBtn">Opslaan</button>
    <button class="btn only-narrow" id="panelBtn">Stuklijst</button>
  </header>

  <div class="main">
    <nav class="rail edit-only" id="rail" aria-label="Gereedschap"></nav>
    <section class="stage" id="stage">
      <canvas id="cv" aria-label="Plattegrond van het veld"></canvas>
      <div class="hud hud-tl" id="hudTop"></div>
      <div class="hud hud-bl">
        <div class="readout"><span>Vak <b id="cell">–</b></span><span class="hide-narrow" id="coord">–</span></div>

function loginFout(e) {

  if (c === 'over_email_send_rate_limit' || (e && e.status === 429)) return 'Er is net al een mail gestuurd. Wacht even en probeer het dan opnieuw.';
  if (c === 'email_address_not_authorized') return 'Naar dit adres mag Supabase geen mail sturen. Gebruik het adres van je Supabase-account.';
  if (c === 'email_address_invalid' || c === 'validation_failed') return 'Dit e-mailadres klopt niet';
  if (c === 'signup_disabled' || c === 'otp_disabled') return 'Inloggen met dit adres is niet toegestaan';
  if (c === 'invalid_credentials' || c === 'invalid_grant') return 'E-mailadres of wachtwoord klopt niet. Nog geen wachtwoord? Kies Mail met code en stel er daarna een in bij Account.';
  if (c === 'email_not_confirmed') return 'Je e-mailadres is nog niet bevestigd. Log in met een mailcode.';
  if (c === 'weak_password') return 'Dit wachtwoord is te zwak. Neem het sterke wachtwoord dat Safari voorstelt, of minstens 8 tekens.';
  if (c === 'same_password') return 'Dit is al je wachtwoord.';
  if (c === 'reauthentication_needed') return 'Log eerst opnieuw in met een mailcode en stel dan je wachtwoord in.';
  if (c === 'login') return 'Je bent niet meer ingelogd. Log opnieuw in met een mailcode.';
  return 'Inloggen lukte niet' + (e && e.message ? ': ' + e.message : '');
}

(async function boot() {

  showEmpty('loading'); draw();

  $('#app').className = 'mode-' + S.mode; setHint();
  renderAuth();

  if (S.mode === 'bouwer') S.view.posts = false;
  let opened = false;
  const tryOpen = () => {
    if (opened || !Store.settingsLoaded || !Store.listLoaded) return;
    opened = true;

    const opgeslagen = draft && draft.docId && Store.docs.get(draft.docId);
    if (draft && opgeslagen && new Date(opgeslagen.updated) > new Date(draft.at || 0)) { draft = null; ls.set('rtt-vp-draft', null); toast('Er is intussen een nieuwere versie opgeslagen; die is geopend'); }
    if (want && draft && draft.docId !== want) draft = null;
